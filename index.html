<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Board - Touchline Style</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-layout">
    <header class="top-header">
      <div class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="brand-icon">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <h2>Tactical Board</h2>
      </div>

      <div class="header-controls">
        <div class="formation-selector-wrapper">

          <button id="open-formation-modal" class="header-btn">
            <span id="home-formation-label">Formation</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="header-divider"></div>

        <div class="formation-selector-wrapper">
          <button id="open-enemy-modal" class="header-btn">
            <span id="away-formation-label">Enemy</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="header-divider"></div>
        
        <div class="zone-selector">
            <button id="toggle-zones-btn" class="header-btn">
            <span>Zones</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
        </div>
      </div>
    </header>

    <div class="app-container">
      <div class="sidebar">
        <button data-tool="select" class="active" title="Select / Move">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5V2z"/></svg>
        </button>
        <button data-tool="line" title="Pass Chain">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M16 6l6 6-6 6"/></svg>
        </button>
        <button data-tool="arrow" title="Run Arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5M19 5h-9M19 5v9"/></svg>
        </button>
        <button data-tool="rect" title="Zone Rectangle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </button>
        <button data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13l-5 5L4 9l5-5 9 9zM14.5 9.5l3 3"/></svg>
        </button>
        <button id="clear-drawings" title="Clear All Drawings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>

        <div class="sidebar-divider"></div>

        <button id="zoom-in" title="Zoom In">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="zoom-out" title="Zoom Out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
        </button>
      </div>

      <div class="pitch-wrapper" id="pitch-wrapper">
        <div id="pitch-zoom-container">
          <div id="pitch" class="pitch">
            <div class="pitch-stripes">
              <div></div><div></div><div></div><div></div><div></div>
              <div></div><div></div><div></div><div></div><div></div>
            </div>

            <div id="pitch-zones" class="pitch-zones hidden"></div>

            <svg id="draw-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs>
                <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <polygon points="0 0, 6 3, 0 6" fill="#fbbf24" />
                </marker>
              </defs>
            </svg>

            <div class="pitch-line center-line"></div>
            <div class="pitch-circle center-circle"></div>
            <div class="pitch-dot center-dot"></div>

            <div class="pitch-area penalty-left"></div>
            <div class="pitch-area goal-left"></div>
            <div class="pitch-arc arc-left"></div>

            <div class="pitch-area penalty-right"></div>
            <div class="pitch-area goal-right"></div>
            <div class="pitch-arc arc-right"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="formation-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Select Home Formation</h3>
        <button id="close-formation-modal" class="close-btn">&times;</button>
      </div>
      <div id="formation-grid" class="formation-grid"></div>
    </div>
  </div>

  <div id="enemy-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Select Away Formation</h3>
        <button id="close-enemy-modal" class="close-btn">&times;</button>
      </div>
      <div id="enemy-formation-grid" class="formation-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
